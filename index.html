<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>1A2B 測試~</title>
<style>
/* 文字顏色 */
#left { color: #dc2626; }
#result { color: #16a34a; font-weight: bold; }
#hint   { color: #2563eb; }
#help   { color: #9333ea; }
/* 整個畫面置中 */
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #f2f2f2;
    font-family: Arial, sans-serif;
}

/* 遊戲主面板 */
#app {
    width: 420px;
    background-color: white;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
}
input { width: 80px; text-align: center; }

.start-title { text-align: center; font-size: 32px; color: #2c3e50; }
.game-title { text-align: center; font-size: 34px; color: #3498db; }
.win-title { text-align: center; font-size: 36px; color: #27ae60; }
.lose-title { text-align: center; font-size: 32px; color: #7f8c8d; }

button {
    margin: 4px;
    padding: 8px 14px;
    font-size: 16px;
    transition: 0.2s;
    cursor: pointer;
}
button:hover { transform: scale(1.05); }

.btn-group {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 10px;
}
.main-btn button { background-color: #3498db; color: white; }
.helper-btn button { background-color: #95a5a6; color: white; }
.danger-btn button { background-color: #e74c3c; color: white; }
</style>
</head>
<body onload="renderStartPage()">
<div id="app"></div>

<script>
/* ========= 全域狀態 ========= */
const state = {
    playerName: "",
    digit: 4,
    useRepeat: false,
    low: "0",
    high: "9",
    answer: "",
    guesscount: 0,
    haveGuessed: false,
    answerbyuser: false,
    starttime: 0,
    candidates:[],
    history: []
};

const allowedChars = "0123456789abcdefghijklmnopqrstuvwxyz";

/* ========= 牌組 ========= */
function initialcandidates(){
    state.candidates=generatepossibilities();
}
function deletecandidates(){
    if(state.history.length === 0) return;
    const last = state.history.at(-1);
    state.candidates = state.candidates.filter(s => checkApulsB(s, last.guess) === (last.A + last.B));
}
function showcandidates(){
    let text="可能的候選人<br>";
    text+=state.candidates.join(",");
    text+="<br>然後重新組合";
    document.getElementById("candidates").innerHTML=text;
}
function getPermutations(str) {
    if (str.length === 1) return [str];
    const result = [];
    for (let i = 0; i < str.length; i++) {
        const char = str[i];                 
        const remaining = str.slice(0,i) + str.slice(i+1); 
        const perms = getPermutations(remaining);          
        for (const perm of perms) {
            result.push(char + perm);
        }
    }
    return result;
}
function generatepossibilities() {
  let min = state.low;
  let max = state.high;
  let length = state.digit;
  let repeat = state.useRepeat;

  const numbers = [];
  for (let i = min; i <= max; i++) {
    numbers.push(i.toString());
  }

  const results = [];

  function backtrack(startIndex, current) {
    if (current.length === length) {
      results.push(current.join(""));
      return;
    }

    for (let i = 0; i < numbers.length; i++) {
      if(!repeat && current.includes(numbers[i])) continue;
      current.push(numbers[i]);
      backtrack(startIndex, current);
      current.pop();
    }
  }

  backtrack(0, []);
  return results;
}

/* ========= 時間 ========= */
function givenow(){ return Date.now(); }
function spendtime(){ return (Date.now()-state.starttime)/1000; }

/* ========= 工具 ========= */
function CharToInt(c){ return allowedChars.indexOf(c); }
function checkrepeat(s){ for(let i=0;i<s.length;i++) for(let j=i+1;j<s.length;j++) if(s[i]===s[j]) return false; return true; }
function charadd1(c){ let a=CharToInt(c); if(a===CharToInt(state.high)) a=CharToInt(state.low); else a++; return allowedChars[a]; }
function stringadd1(s){
    let a = s.split("");
    for(let i = a.length-1; i >= 0; i--){
        if(a[i] === state.high){
            a[i] = state.low;
        } else {
            a[i] = charadd1(a[i]);
            break;
        }
    }
    return a.join("");
}
function countChar(s,c){ return [...s].filter(x=>x===c).length; }

/* ========= 開始畫面 ========= */
function renderStartPage(){
    state.answerbyuser=false;
    const app=document.getElementById("app");
    app.innerHTML=`
        <h2 class="start-title">歡迎來到1A2B</h2>
        玩家名稱 <input id="nameInput" value="${state.playerName}"><br><br>
        位數 <input id="digitInput" type="number" value="${state.digit}"><br><br>
        最低位 <input id="lowInput" value="${state.low}" maxlength="1"><br><br>
        最高位 <input id="highInput" value="${state.high}" maxlength="1"><br><br>
        允許重複 <input type="checkbox" id="useRepeat" ${state.useRepeat?"checked":""}><br><br>
        <button onclick="startGame()">電腦出題</button>
        <button onclick="startGame2()">我來出題</button>
        <button onclick="describe()">規則說明</button>
    `;
}

/* ========= 說明 ========= */
function describe(){
    const app=document.getElementById("app");
    app.innerHTML=`
        <h2 class="start-title">規則說明</h2>
        遊戲規則：答案由玩家設定，包含重複或不重複、位數及幾進位(本遊戲支援36進位 a=10 ... z)<br>
        提示按鈕：輸入自己的答案後，告訴使用者是否與歷史紀錄矛盾<br>
        幫助按鈕：提供一組與歷史紀錄不矛盾的答案<br>
        顯示剩餘解按鈕：計算剩餘可能組合<br>
        我來提示系統猜按鈕：(此步驟會消耗一次猜的機會，請謹慎使用)輸入一個符合長度和上下界的數字，系統幫你排成和前面幾次猜測都不矛盾的組合，注意到假設無論怎麼湊都會矛盾，系統會自動猜一開始輸入的數<br>
        顯示候選人：系統跑出剩下哪幾組數字可以用，記得搭配"我來提示系統猜按鈕"使用喔~<br>
        <button onclick="renderStartPage()">回開始</button>
    `;
}

/* ========= 使用者出題 ========= */
function startGame2(){
    state.playerName=document.getElementById("nameInput").value;
    state.digit=Number(document.getElementById("digitInput").value);
    state.useRepeat=document.getElementById("useRepeat").checked;
    state.low=document.getElementById("lowInput").value;
    state.high=document.getElementById("highInput").value;

    if(state.playerName.length===0){ alert("請輸入玩家名稱"); return; }
    if(CharToInt(state.low)===-1||CharToInt(state.high)===-1){ alert("最低或最高位不合法"); return; }
    if(CharToInt(state.high)<CharToInt(state.low)){ alert("最高位不能小於最低位"); return; }
    if(!state.useRepeat && CharToInt(state.high)-CharToInt(state.low)+1<state.digit){ alert("字元數不足，必定重複"); return; }
    state.answerbyuser = true;
    const app = document.getElementById("app");
    app.innerHTML = `
        <h2 class="start-title">輸入答案</h2>
        我的答案 <input id="answerInput" value="${state.answer}"><br><br>
        <button onclick="renderStartPage()">回首頁</button>
        <button onclick="TostartGame()">出發</button>
    `;
}

function TostartGame(){
    let input = document.getElementById("answerInput").value;
    
    if(!validGuess(input)){
        alert("請輸入正確答案格式");
        return;
    }

    state.answer = input;
    state.history = [];
    state.guesscount = 0;
    state.haveGuessed = false;
    state.starttime=Date.now();
    initialcandidates();

    renderGamePage();
}

/* ========= 開始遊戲 ========= */
function startGame(){
    const app=document.getElementById("app");

    state.playerName=document.getElementById("nameInput").value;
    state.digit=Number(document.getElementById("digitInput").value);
    state.useRepeat=document.getElementById("useRepeat").checked;
    state.low=document.getElementById("lowInput").value;
    state.high=document.getElementById("highInput").value;

    if(state.playerName.length===0){ alert("請輸入玩家名稱"); return; }
    if(CharToInt(state.low)===-1||CharToInt(state.high)===-1){ alert("最低或最高位不合法"); return; }
    if(CharToInt(state.high)<CharToInt(state.low)){ alert("最高位不能小於最低位"); return; }
    if(!state.useRepeat && CharToInt(state.high)-CharToInt(state.low)+1<state.digit){ alert("字元數不足，必定重複"); return; }
    if(!state.answerbyuser){ state.answer=state.useRepeat?RandomNumberRepeat():RandomNumberNoRepeat(); }
    
    state.history=[]; state.guesscount=0; state.haveGuessed=false;
    state.starttime=Date.now();
    initialcandidates();
    renderGamePage();
}

/* ========= 遊戲畫面 ========= */
function renderGamePage(){
    showHistory();
    const app=document.getElementById("app");
    let titleWords = "";
    if(state.answerbyuser === false){
        titleWords = "猜電腦數字";
    } else {
        titleWords = `猜${state.playerName}出的數字`;
    }

    let InnerTexts = "";
    if(state.answerbyuser === false){
        InnerTexts = `玩家：${state.playerName}`;
    } else {
        InnerTexts = `出題者：${state.playerName}`;
    }
    app.innerHTML=`
        <h2 class="game-title">${titleWords}</h2>
        <p>${InnerTexts}</p>
        <p>請猜${state.digit}位數，上限${state.high}，下限${state.low}</p>
        <p id="historys"></p>
        <p>第 ${state.guesscount+1} 次猜測</p>
        <input id="guessInput">

        <div class="btn-group main-btn">
            <button onclick="guess()">猜</button>
            <button onclick="guessbyrearrange()">我來提示系統猜</button>
            <button onclick="nextRound()">下一次</button>
        </div>
        <div class="btn-group helper-btn">
            <button onclick="giveHint()">提示</button>
            <button onclick="giveHelp()">幫助</button>
            <button onclick="showLeft()">顯示剩餘解數量</button>
            <button onclick="showcandidates()">顯示候選人</button>
        </div>
        <div class="btn-group danger-btn">
            <button onclick="giveUp()">放棄</button>
            <button onclick="renderStartPage()">回開始</button>
        </div>

        <p id="result"></p>
        <p id="hint"></p>
        <p id="help"></p>
        <p id="left"></p>
        <p id="candidates"></p>
    `;
    deletecandidates();
}

/* ========= 猜 ========= */
function guess(){
    let input=document.getElementById("guessInput").value;
    if(state.haveGuessed){ alert("本回合已猜"); return; }
    if(!validGuess(input)) return;

    let A=checkA(state.answer,input);
    let B=checkB(state.answer,input);
    state.history.push({guess:input,A,B});
    state.haveGuessed=true;

    document.getElementById("result").innerText=`${input} → ${A}A${B}B`;
    showHistory();
    if(A===state.digit) victoryPage();
}

/* ========= 系統提示猜 ========= */
function guessbyrearrange(){
    if(state.haveGuessed){ alert("本回合已猜"); return; }
    let input=document.getElementById("guessInput").value;
    if(!validGuess(input)) return;

    let candidate = state.candidates.find(s => correctguess(s) === -1);
    if(candidate){
        input = candidate;
        alert(`系統選擇猜測: ${input}`);
    } else {
        alert(`無法找到完全符合的，將使用輸入數字: ${input}`);
    }

    let A=checkA(state.answer,input);
    let B=checkB(state.answer,input);
    state.history.push({guess:input,A,B});
    state.haveGuessed=true;
    document.getElementById("result").innerText=`${input} → ${A}A${B}B`;
    showHistory();
    if(A===state.digit) victoryPage();
}

function nextRound(){
    if(!state.haveGuessed){ alert("請先猜一次"); return; }
    state.guesscount++; state.haveGuessed=false;
    renderGamePage();
}

/* ========= 提示 ========= */
function correctguess(s){
    for(let i=0;i<state.history.length;i++){
        let h=state.history[i];
        if(checkA(h.guess,s)!==h.A || checkB(h.guess,s)!==h.B) return i;
    }
    return -1;
}

function giveHint(){
    if(state.history.length===0){ alert("第一次沒有提示"); return; }
    let input=document.getElementById("guessInput").value;
    if(!validGuess(input)) return;
    let a=correctguess(input);
    let msg=(a===-1)?"此猜測與所有歷史紀錄相容":`與第 ${a+1} 次猜測矛盾`;
    document.getElementById("hint").innerText=msg;
}

/* ========= 幫助 ========= */
function giveHelp(){
    let s;
    if(state.useRepeat){
        s=RandomNumberRepeat();
        while(correctguess(s)!==-1) s=stringadd1(s);
    } else {
        s=RandomNumberNoRepeat();
        while(true){
            if(!checkrepeat(s)){ s=stringadd1(s); continue; }
            if(correctguess(s)===-1) break;
            s=stringadd1(s);
        }
    }
    document.getElementById("help").innerText=`${s} 是一組解`;
}

/* ========= 剩餘解 ========= */
function showLeft(){
    document.getElementById("left").innerText = `剩下 ${state.candidates.length} 組解`;
}

/* ========= 結果 ========= */
function victoryPage(){
    const app=document.getElementById("app");
    let a=spendtime();
    app.innerHTML=`
        <h2 class="win-title">🎉 恭喜猜中！</h2>
        <p id="historys"></p>
        <p>答案：${state.answer}</p>
        <p>耗時：${a}秒</p>
        <button onclick="renderStartPage()">回開始</button>
    `;
    showHistory();
}
function giveUp(){
    const app=document.getElementById("app");
    let a=spendtime();
    app.innerHTML=`
        <h2 class="lose-title">😢 放棄了</h2>
        <p id="historys"></p>
        <p>答案：${state.answer}</p>
        <p>耗時：${a}秒</p>
        <button onclick="renderStartPage()">回開始</button>
    `;
    showHistory();
}

/* ========= 歷史 ========= */
function showHistory(){
    let html="<b>歷史紀錄</b><br>";
    if(state.history.length===0) html+="暫無紀錄";
    state.history.forEach((h,i)=>{
        html+=`第 ${i+1} 次：${h.guess} → ${h.A}A${h.B}B<br>`;
    });
    document.getElementById("historys").innerHTML=html;
}

/* ========= 驗證 ========= */
function validGuess(input){
    if(input.length!==state.digit){ alert("輸入長度錯誤"); return false; }
    for(let c of input){
        let idx=CharToInt(c);
        if(idx===-1||idx<CharToInt(state.low)||idx>CharToInt(state.high)){
            alert("含非法或超出範圍字元"); return false;
        }
    }
    if(!state.useRepeat && new Set(input).size!==input.length){ alert("不允許重複"); return false; }
    return true;
}

/* ========= 判斷 ========= */
function checkA(a,g){ let A=0; for(let i=0;i<a.length;i++) if(a[i]===g[i]) A++; return A; }
function checkB(a,g){ let B=0; for(let i=CharToInt(state.low);i<=CharToInt(state.high);i++){ let c=allowedChars[i]; B+=Math.min(countChar(a,c),countChar(g,c)); } return B-checkA(a,g); }
function checkApulsB(a,g){ return checkA(a,g)+checkB(a,g) }

/* ========= 亂數 ========= */
function RandomNumberRepeat(){ let r="",s=CharToInt(state.low),e=CharToInt(state.high); for(let i=0;i<state.digit;i++) r+=allowedChars[s+Math.floor(Math.random()*(e-s+1))]; return r; }
function RandomNumberNoRepeat(){ let pool=allowedChars.slice(CharToInt(state.low),CharToInt(state.high)+1).split(""); let r=""; for(let i=0;i<state.digit;i++){ let idx=Math.floor(Math.random()*pool.length); r+=pool.splice(idx,1)[0]; } return r; }

</script>
</body>
</html>
