<h2>BMI 計算</h2>

身高（cm）：<input type="number" id="height"><br>
體重（kg）：<input type="number" id="weight"><br><br>
輸入要玩幾位數：<input type="number" id="digit"><br><br>
<button onclick="calcBMI()">計算</button>
<p id="bmiResult"></p>
<button onclick="digits()">位數</button>
<p id="digitcount"></p>
<script>
function calcBMI() {
    let h = document.getElementById("height").value / 100;
    let w = document.getElementById("weight").value;
    let bmi = w / (h * h);

    document.getElementById("bmiResult").innerText =
        "你的 BMI 是：" + bmi.toFixed(3);//小數點後幾位
}
function digits() {
    let digit = document.getElementById("digit").value;
    document.getElementById("digitcount").innerText =
        "你輸入數字" + digit.toFixed(3);//小數點後幾位
}
</script>
