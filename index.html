<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>1A2B測試3</title>
<style>
#left { color: #dc2626; }
#result { color: #16a34a; font-weight: bold; }
#hint   { color: #2563eb; }
#help   { color: #9333ea; }

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f2f2f2;
    font-family:Arial;
}
#app{
    width:420px;
    background:white;
    padding:24px;
    border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.15);
}
input{ width:80px; text-align:center; }
button{ margin:4px; padding:8px 14px; font-size:16px; cursor:pointer; }
.btn-group{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:8px; }
</style>
</head>

<body onload="renderStartPage()">
<div id="app"></div>

<script>
/* ========= 狀態 ========= */
const state={
    playerName:"",
    digit:4,
    useRepeat:false,
    low:"0",
    high:"9",
    answer:"",
    guesscount:0,
    haveGuessed:false,
    answerbyuser:false,
    starttime:0,
    candidates:[],
    history:[]
};

const allowedChars="0123456789abcdefghijklmnopqrstuvwxyz";

/* ========= 工具 ========= */
function CharToInt(c){ return allowedChars.indexOf(c); }
function countChar(s,c){ return [...s].filter(x=>x===c).length; }
function checkrepeat(s){ return new Set(s).size===s.length; }

/* ========= 時間 ========= */
function spendtime(){ return ((Date.now()-state.starttime)/1000).toFixed(2); }

/* ========= 產生所有可能 ========= */
function generatepossibilities(){
    const res=[];
    const chars=allowedChars.slice(CharToInt(state.low),CharToInt(state.high)+1);

    function dfs(cur){
        if(cur.length===state.digit){
            res.push(cur);
            return;
        }
        for(const c of chars){
            if(!state.useRepeat && cur.includes(c)) continue;
            dfs(cur+c);
        }
    }
    dfs("");
    return res;
}

function initialcandidates(){
    state.candidates=generatepossibilities();
}

function deletecandidates(){
    if(state.history.length===0) return;
    const last=state.history.at(-1);
    state.candidates=state.candidates.filter(s=>{
        return checkA(s,last.guess)===last.A &&
               checkB(s,last.guess)===last.B;
    });
}

/* ========= 判斷 ========= */
function checkA(a,g){
    let A=0;
    for(let i=0;i<a.length;i++) if(a[i]===g[i]) A++;
    return A;
}
function checkB(a,g){
    let B=0;
    for(let i=CharToInt(state.low);i<=CharToInt(state.high);i++){
        const c=allowedChars[i];
        B+=Math.min(countChar(a,c),countChar(g,c));
    }
    return B-checkA(a,g);
}

/* ========= 驗證 ========= */
function validGuess(input){
    if(input.length!==state.digit){
        alert("輸入長度錯誤");
        return false;
    }
    for(const c of input){
        const idx=CharToInt(c);
        if(idx===-1 || idx<CharToInt(state.low) || idx>CharToInt(state.high)){
            alert("含非法或超出範圍字元");
            return false;
        }
    }
    if(!state.useRepeat && !checkrepeat(input)){
        alert("不允許重複");
        return false;
    }
    return true;
}

/* ========= 畫面 ========= */
function renderStartPage(){
    const app=document.getElementById("app");
    app.innerHTML=`
    <h2>1A2B</h2>
    名稱 <input id="nameInput" value="${state.playerName}"><br><br>
    位數 <input id="digitInput" type="number" value="${state.digit}"><br><br>
    最低 <input id="lowInput" value="${state.low}" maxlength="1"><br><br>
    最高 <input id="highInput" value="${state.high}" maxlength="1"><br><br>
    重複 <input type="checkbox" id="useRepeat" ${state.useRepeat?"checked":""}><br><br>
    <button onclick="startGame()">電腦出題</button>
    `;
}

function startGame(){
    state.playerName=nameInput.value;
    state.digit=+digitInput.value;
    state.low=lowInput.value;
    state.high=highInput.value;
    state.useRepeat=useRepeat.checked;

    state.answer=state.useRepeat?randomRepeat():randomNoRepeat();
    state.history=[];
    state.guesscount=0;
    state.haveGuessed=false;
    state.starttime=Date.now();
    initialcandidates();
    renderGamePage();
}

function renderGamePage(){
    deletecandidates();
    const app=document.getElementById("app");
    app.innerHTML=`
    <h3>第 ${state.guesscount+1} 次猜測</h3>
    <p id="historys"></p>
    <input id="guessInput">
    <div class="btn-group">
        <button onclick="guess()">猜</button>
        <button onclick="showLeft()">剩餘解</button>
        <button onclick="showcandidates()">候選</button>
    </div>
    <p id="result"></p>
    <p id="left"></p>
    <p id="candidates"></p>
    `;
    showHistory();
}

function guess(){
    if(state.haveGuessed) return;
    const input=guessInput.value;
    if(!validGuess(input)) return;

    const A=checkA(state.answer,input);
    const B=checkB(state.answer,input);
    state.history.push({guess:input,A,B});
    state.haveGuessed=true;
    result.innerText=`${input} → ${A}A${B}B`;

    if(A===state.digit){
        alert(`勝利！耗時 ${spendtime()} 秒`);
        renderStartPage();
        return;
    }
    state.guesscount++;
    state.haveGuessed=false;
    renderGamePage();
}

/* ========= 顯示 ========= */
function showHistory(){
    const h=document.getElementById("historys");
    if(!h) return;
    h.innerHTML=state.history.map((x,i)=>
        `第${i+1}次：${x.guess} → ${x.A}A${x.B}B`
    ).join("<br>");
}
function showLeft(){
    left.innerText=`剩下 ${state.candidates.length} 組`;
}
function showcandidates(){
    candidates.innerText=state.candidates.join(",");
}

/* ========= 亂數 ========= */
function randomRepeat(){
    let r="";
    const s=CharToInt(state.low), e=CharToInt(state.high);
    for(let i=0;i<state.digit;i++){
        r+=allowedChars[s+Math.floor(Math.random()*(e-s+1))];
    }
    return r;
}
function randomNoRepeat(){
    let pool=allowedChars.slice(CharToInt(state.low),CharToInt(state.high)+1).split("");
    let r="";
    for(let i=0;i<state.digit;i++){
        const idx=Math.floor(Math.random()*pool.length);
        r+=pool.splice(idx,1)[0];
    }
    return r;
}
</script>
</body>
</html>
