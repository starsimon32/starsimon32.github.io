<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>組合產生器（可重複 / 不可重複）</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    input, button {
      margin: 5px;
    }
    #result {
      margin-top: 20px;
      white-space: pre-wrap;
      font-family: monospace;
    }
  </style>
</head>
<body>

<h2>組合產生器（順序不重要）</h2>

<label>下界：</label>
<input type="number" id="min" value="0">

<label>上界：</label>
<input type="number" id="max" value="4">
<br>

<label>位數：</label>
<input type="number" id="length" value="2" min="1">
<br>

<label>
  <input type="checkbox" id="repeat">
  可重複
</label>
<br>

<button onclick="generate()">產生組合</button>

<div id="result"></div>

<script>
function generate() {
  const min = parseInt(document.getElementById("min").value);
  const max = parseInt(document.getElementById("max").value);
  const length = parseInt(document.getElementById("length").value);
  const repeat = document.getElementById("repeat").checked;

  const numbers = [];
  for (let i = min; i <= max; i++) {
    numbers.push(i.toString());
  }

  const results = [];

  function backtrack(startIndex, current) {
    if (current.length === length) {
      results.push(current.join(""));
      return;
    }

    for (let i = startIndex; i < numbers.length; i++) {
      current.push(numbers[i]);
      backtrack(repeat ? i : i + 1, current);
      current.pop();
    }
  }

  backtrack(0, []);

  document.getElementById("result").textContent =
    `共 ${results.length} 種組合：\n` + results.join("、");
}
</script>

</body>
</html>
