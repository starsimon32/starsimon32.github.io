<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>排列產生器測試頁</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        input { padding: 5px; font-size: 16px; }
        button { padding: 5px 10px; font-size: 16px; margin-left: 5px; }
        #output { margin-top: 20px; white-space: pre-wrap; background: #fff; padding: 10px; border-radius: 5px; box-shadow: 0 0 5px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <h1>排列產生器</h1>
    <p>輸入字元，例如：123</p>
    <input type="text" id="inputStr" placeholder="輸入字元">
    <button onclick="generatePermutations()">產生排列</button>

    <div id="output"></div>

    <script>
        // 直觀遞迴排列函式
        function getPermutations(str) {
            if (str.length === 1) return [str];

            const result = [];

            for (let i = 0; i < str.length; i++) {
                const char = str[i];                 
                const remaining = str.slice(0,i) + str.slice(i+1); 
                const perms = getPermutations(remaining);          
                for (const perm of perms) {
                    result.push(char + perm);
                }
            }

            return result;
        }

        function generatePermutations() {
            const input = document.getElementById("inputStr").value.trim();
            if (!input) {
                alert("請輸入字元");
                return;
            }

            const permutations = getPermutations(input);
            document.getElementById("output").textContent = permutations.join("\n");
        }
    </script>
</body>
</html>
